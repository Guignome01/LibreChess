<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreChess - GameMode Selection</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./scripts/api.js"></script>
    <script src="./scripts/provider.js"></script>
</head>

<body>
    <div class="container">
        <h2>GameMode Selection</h2>
        <div class="game-grid">
            <div class="game-mode available mode-1" onclick="selectGame(1)">
                <h3>Chess Moves</h3>
                <p>Human vs Human</p>
                <p>Visualize available moves</p>
            </div>
            <div class="game-mode available mode-2" onclick="showBotConfig()">
                <h3>Chess Bot</h3>
                <p>Human vs AI</p>
                <p>Multiple engines</p>
            </div>
            <div class="game-mode available mode-3" onclick="selectGame(3)">
                <h3>Lichess</h3>
                <p>Play online games</p>
                <p>on your physical board</p>
            </div>
            <div class="game-mode available mode-4" onclick="selectGame(4)">
                <h3>Sensor Test</h3>
                <p>Test board sensors</p>
            </div>
        </div>

        <!-- Bot Configuration Panel (hidden by default) -->
        <div id="botConfigPanel" class="config-panel anim-panel">
            <h3>Bot Configuration</h3>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Engine:</label><br>
                <select id="botEngine" onchange="updateDifficultyOptions()" style="padding: 8px; font-size: 16px; margin-top: 5px; width: 100%;">
                    <option value="stockfish" selected>Stockfish (Cloud API)</option>
                    <option value="librechess">LibreChess (On-board)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Your Color:</label><br>
                <select id="botPlayerColor" style="padding: 8px; font-size: 16px; margin-top: 5px; width: 100%;">
                    <option value="white">Play as White (bot is Black)</option>
                    <option value="black">Play as Black (bot is White)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">Difficulty:</label><br>
                <select id="botDifficulty" style="padding: 8px; font-size: 16px; margin-top: 5px; width: 100%;">
                </select>
            </div>

            <button onclick="selectGame(2)"
                style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;">
                Start Game
            </button>
            <button onclick="hideBotConfig()"
                style="padding: 10px 20px; font-size: 16px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px;">
                Cancel
            </button>
        </div>

        <a href="./board.html" class="button">View Board</a>
        <a href="./index.html" class="back-button">LibreChess Home</a>
    </div>
    <script>
        // Engine-specific difficulty levels (label + search depth per level 1-8)
        const ENGINE_LEVELS = {
            stockfish: [
                {label: 'Beginner', depth: 6}, {label: 'Easy', depth: 7},
                {label: 'Intermediate', depth: 8}, {label: 'Medium', depth: 9},
                {label: 'Advanced', depth: 10}, {label: 'Hard', depth: 12},
                {label: 'Expert', depth: 14}, {label: 'Master', depth: 16}
            ],
            librechess: [
                {label: 'Beginner', depth: 1}, {label: 'Easy', depth: 2},
                {label: 'Intermediate', depth: 3}, {label: 'Medium', depth: 4},
                {label: 'Advanced', depth: 5}, {label: 'Hard', depth: 6},
                {label: 'Expert', depth: 7}, {label: 'Master', depth: 8}
            ]
        };
        const DEFAULT_LEVEL = 4;

        function updateDifficultyOptions() {
            const engine = document.getElementById('botEngine').value;
            const select = document.getElementById('botDifficulty');
            const prev = select.value;
            select.innerHTML = '';
            const levels = ENGINE_LEVELS[engine] || ENGINE_LEVELS.stockfish;
            levels.forEach((l, i) => {
                const opt = document.createElement('option');
                opt.value = i + 1;
                opt.textContent = (i + 1) + ' \u2014 ' + l.label + ' (Depth ' + l.depth + ')';
                if (i + 1 === DEFAULT_LEVEL) opt.selected = true;
                select.appendChild(opt);
            });
            if (prev && select.querySelector('option[value="' + prev + '"]'))
                select.value = prev;
        }
        updateDifficultyOptions();

        function showBotConfig() {
            document.getElementById('botConfigPanel').classList.add('visible');
        }

        function hideBotConfig() {
            document.getElementById('botConfigPanel').classList.remove('visible');
        }

        function selectGame(mode) {
            if (mode === 1 || mode === 2 || mode === 3 || mode === 4) {
                const playerColor = mode === 2 ? document.getElementById('botPlayerColor').value : undefined;
                const difficulty = mode === 2 ? document.getElementById('botDifficulty').value : undefined;
                const engine = mode === 2 ? document.getElementById('botEngine').value : undefined;
                Api.selectGame(mode, playerColor, difficulty, engine)
                    .then(response => {
                    if (!response.ok) {
                        if (mode === 3) {
                            alert('Please configure your Lichess API token in the Home page settings first.');
                        } else {
                            alert('Failed to select game mode. Please try again.');
                        }
                        return;
                    }
                    if (mode != 4) // Don't redirect for sensor test
                        window.location.href = "./board.html";
                }).catch(error => {
                    console.error('Error:', error);
                    alert('Failed to select game mode. Please try again.');
                });
            } else {
                alert('This game mode doesn\'t exist!');
            }
        }
    </script>
</body>
</html>
