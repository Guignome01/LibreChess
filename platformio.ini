; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv ; https://docs.platformio.org/en/stable/platforms/espressif32.html#id19
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I.pio/libdeps/native/Unity/src -fno-asynchronous-unwind-tables
extra_scripts = 
	pre:src/web/build/minify.py
	pre:src/web/build/prepare_littlefs.py
	src/web/build/upload_fs.py
lib_deps = 
	makuna/NeoPixelBus@^2.8.3
	bblanchon/ArduinoJson@^7.4.2
	esp32async/AsyncTCP@^3.4.10
	esp32async/ESPAsyncWebServer@^3.9.5
lib_ignore = 
	ESPAsyncTCP
	RPAsyncTCP
lib_ldf_mode = deep
test_ignore = *

[env:native]
platform = native
; -O2 -DNDEBUG matches tools/engine (SPRT binary) and ESP32 release builds.
; Without -O, gcc defaults to -O0 which runs ~7× slower and makes benchmark
; timings meaningless (no inlining / constant folding / dead store removal).
build_flags = -std=gnu++17 -O2 -DNDEBUG -DUNITY_SUPPORT_64
lib_deps =
lib_ldf_mode = deep
test_ignore = test_statistics
platform_packages = toolchain-gccmingw32

[env:native_stats]
extends = env:native
build_flags = ${env:native.build_flags} -DSTATS
test_filter = test_statistics
test_ignore =
